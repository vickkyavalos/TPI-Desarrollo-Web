<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mis Reservas</title>
    <link rel="stylesheet" href="../css/panel-usuario.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Header -->
    <header class="sticky-top">
      <nav class="navbar navbar-expand-lg">
        <div
          class="container-fluid position-relative d-flex align-items-center justify-content-between py-2"
        >
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarTogglerDemo01"
            aria-controls="navbarTogglerDemo01"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarTogglerDemo01">
            <a class="navbar-brand" href="#"></a>
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 nav-links">
              <li class="nav-item">
                <a
                  class="nav-link active"
                  aria-current="page"
                  href="../index.html"
                  >Inicio</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="../templates/catalogo.html"
                  >Catálogo</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="../templates/quienes-somos.html"
                  >Nosotros</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="../templates/contacto.html"
                  >Contacto</a
                >
              </li>
              <li class="nav-item" id="admin-nav-item" style="display: none">
                <a class="nav-link" href="../templates/panel-admin.html"
                  >Panel Admin</a
                >
              </li>
            </ul>
          </div>
        </div>
      </nav>
      <div
        id="logoHeader"
        class="position-absolute top-50 start-50 translate-middle"
      >
        <img
          src="../assets/icons/logo.svg"
          alt="logo de la empresa"
          class="logo"
        />
      </div>
      <div id="icon-container" class="d-flex align-items-center gap-2">
        <a id="icono-link" href="../templates/reserva-usuario.html">
          <img
            id="icono"
            src="/assets/icons/person-fill.svg"
            alt="Icono"
            width="32"
            height="32"
          />
        </a>
        <div
          id="user-info"
          class="d-flex align-items-center gap-2"
          style="display: none"
        >
          <span id="nombre-usuario" class="fw-bold text-white"></span>
          <button id="btn-logout" class="btn btn-outline-light btn-sm">
            Cerrar sesión
          </button>
        </div>
      </div>
    </header>

    <!--Main -->
    <main class="container my-5">
      <h2 class="text-center mb-4">Mis Reservas</h2>
      <div class="table-responsive">
        <table class="table table-bordered table-striped">
          <thead class="table-primary">
            <tr>
              <th>#</th>
              <th>Servicios</th>
              <th>Salón</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody id="tablaReservas"></tbody>
        </table>
      </div>
    </main>

    <!-- Footer -->
    <footer class="py-4 text-center">
      <p>&copy; 2025 IDW S.A</p>
    </footer>

    <script src="../js/logout.js"></script>
    <script src="../js/reservas-usuario.js"></script>
    <script src="../js/presupuesto.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
